name: sys-info-test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.0.0
      with:
         node-version: '24.21.0'
    - name: use npm
      run: |
       npm install
       npm start